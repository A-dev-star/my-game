<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg: #0f0f0f;
            --sidebar: #161616;
            --accent: #ff4757;
            --text: #ffffff;
            --hover: #2f3542;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        .app-container { display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #222; }
        .brand { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        
        .nav-header { font-size: 11px; text-transform: uppercase; color: #555; margin: 20px 0 10px 10px; }
        .nav-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 15px; margin-bottom: 4px; transition: 0.2s; color: #a0a0a0; }
        .nav-item:hover { background: var(--hover); color: white; }
        .nav-item.active { background: var(--accent); color: white; }

        /* Content Area */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-bar { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; }

        /* Views */
        .view-section { display: none; padding: 40px; }
        .view-section.active { display: block; }
        
        .hero-title { font-size: 60px; font-weight: 900; margin: 0; background: linear-gradient(to right, #ff4757, #ff6b81); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-sub { color: #888; font-size: 20px; margin-bottom: 30px; }

        /* Grid for Games & Movies */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .card { background: #1e1e1e; border-radius: 15px; overflow: hidden; transition: 0.3s; cursor: pointer; border: 1px solid #222; text-decoration: none; color: white; display: block; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(255, 71, 87, 0.2); }
        
        .card-img { height: 150px; background-size: cover; background-position: center; }
        .card-title { padding: 12px; font-size: 14px; text-align: center; font-weight: 600; }

        /* Online Status */
        .sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid #222; }
        .online-status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .dot { width: 8px; height: 8px; background: #2ed573; border-radius: 50%; box-shadow: 0 0 10px #2ed573; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="brand"><i class="fa-solid fa-gamepad" style="color:var(--accent);"></i> RG V2</div>

        <div class="nav-links">
            <div class="nav-header">Menu</div>
            <div class="nav-item active" onclick="switchView('view-home', this)"><i class="fa-solid fa-house"></i> Home</div>
            <div class="nav-item" onclick="switchView('view-all', this)"><i class="fa-solid fa-layer-group"></i> All Games</div>
            <div class="nav-item" onclick="switchView('view-movies', this)"><i class="fa-solid fa-film"></i> Movies</div>
            
            <div class="nav-header">Info</div>
            <div class="nav-item" onclick="switchView('view-credits', this)"><i class="fa-solid fa-circle-info"></i> Credits</div>
        </div>

        <div class="sidebar-footer">
            <div class="online-status"><div class="dot"></div> <span>42 Users Online</span></div>
            <div style="color: #444; font-size: 11px; margin-top: 5px;">V2.2 • Updated Today</div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div id="time-display" style="font-weight: 600;">12:00 PM</div>
        </div>

        <!-- HOME -->
        <div id="view-home" class="view-section active">
            <h1 class="hero-title">Reids Games V2</h1>
            <p class="hero-sub">Play. Save. Relax.</p>
            <button onclick="switchView('view-all')" style="padding: 15px 30px; border-radius: 30px; border: none; background: var(--accent); color: white; font-weight: 700; cursor: pointer;">Browse Library</button>
        </div>

        <!-- ALL GAMES SECTION -->
        <div id="view-all" class="view-section">
            <h2>All Games</h2>
            <div class="games-grid">
                
                <!-- GAME 1 -->
                <a href="https://minecraft.net" target="_blank" class="card">
                    <div class="card-img" style="background-image: url('https://gstatic.com');"></div>
                    <div class="card-title">Minecraft Classic</div>
                </a>

                <!-- GAME 2 -->
                <a href="https://retrobowl.me" target="_blank" class="card">
                    <div class="card-img" style="background-image: url('https://googleusercontent.com');"></div>
                    <div class="card-title">Retro Bowl</div>
                </a>

                <!-- GAME 3 -->
                <a href="https://1v1.lol" target="_blank" class="card">
                    <div class="card-img" style="background-image: url('https://googleusercontent.com');"></div>
                    <div class="card-title">1v1.LOL</div>
                </a>

            </div>
        </div>

        <!-- MOVIES SECTION -->
        <div id="view-movies" class="view-section">
            <h2>Movies</h2>
            <div class="games-grid">
                <div class="card">
                    <div class="card-img" style="background-image: url('https://wikimedia.org');"></div>
                    <div class="card-title">Cloudy with Meatballs</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function switchView(viewId, element) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if (element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('time-display').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
